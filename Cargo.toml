[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later WITH AdditionRef-SoftPresenter-additional-permission"

[workspace.dependencies]
sp-model = { path = "crates/sp-model" }
sp-engine = { path = "crates/sp-engine" }
sp-render = { path = "crates/sp-render" }
sp-ndi = { path = "crates/sp-ndi" }
sp-decklink = { path = "crates/sp-decklink" }
sp-bible = { path = "crates/sp-bible" }
sp-video = { path = "crates/sp-video" }
# Fetching Bibles: a small blocking HTTPS client, and the checksum each download is checked against.
ureq = "3"
sha2 = "0.10"
# Graphics crates change their APIs between releases: pinned exactly.
vello = "=0.12.0"
parley = "=0.13.0"
winit = "=0.30.13"
egui = { version = "=0.37.0", features = ["default_fonts"] }
egui-wgpu = "=0.37.0"
egui-winit = "=0.37.0"
# The time on stage screens, in the computer's own time zone.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Playing audio files: walk-in music and other tracks.
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3", "wav", "flac", "mp4", "vorbis", "symphonia-aiff"] }
# The system's own window for choosing files to add.
rfd = "0.17"
# Moving a deleted song's file to the Trash rather than erasing it.
trash = "5"
# Song packs (.sppack): zip files, written and read with deflate only, in Rust (no other
# compression formats, no native libraries).
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Reading Bibles in other programs' XML formats: a streaming reader that never expands a
# document's own entities or fetches anything it names.
quick-xml = { version = "0.41", default-features = false }
# Reading presentation files (.pptx) as slides: a small tree reader that refuses document type
# declarations, so it never expands an entity or fetches anything a file names.
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
# The free space on a disk, on every system, before a song pack is opened.
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
# The macOS menu bar.
muda = { version = "=0.21.2", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "1"
png = "0.18"
# Decoding pictures dropped into the media bin.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

# Vello 0.12.0 with SoftPresenter's change to how it sizes its GPU scratch buffers:
# third_party/vello/PROVENANCE.md says what was changed and why.
[patch.crates-io]
vello = { path = "third_party/vello" }
# Fontique 0.13.0, which finds the fonts Parley lays text out in, with font files read into
# memory instead of mapped: third_party/fontique/PROVENANCE.md says why.
fontique = { path = "third_party/fontique" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
