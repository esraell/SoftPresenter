[package]
name = "sp-video"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The sound of videos played through FFmpeg, and what ffprobe says of a video.
rodio.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "objc2-core-graphics"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
objc2-core-foundation = "0.3"
# The names macOS gives the displays ("HP 27f", "3DTV"), for the Screens window; and the
# off-screen window a web page is drawn in.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSGraphics", "NSWindow", "NSView", "NSResponder", "NSImage", "NSColor", "NSApplication", "NSGraphicsContext", "NSImageRep", "objc2-core-foundation", "objc2-core-graphics"] }
# Web pages in boxes on slides, drawn off-screen by the system's web view.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "WKNavigationDelegate", "WKUIDelegate", "WKNavigationAction", "WKNavigationResponse", "WKNavigation", "WKWebsiteDataStore", "WKPreferences", "WKFrameInfo", "WKSecurityOrigin", "WKWindowFeatures", "WKDownload", "WKUserContentController", "WKContentWorld"] }
block2 = "0.6"
# Videos the system plays go to the GPU without a copy: each decoded picture's memory is
# handed to wgpu as a texture (mac/gpu.rs). The versions are the ones wgpu itself and Vello
# already use, so nothing new is built.
wgpu = { version = "30", default-features = false, features = ["metal", "wgpu-core", "std", "parking_lot"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLPixelFormat", "MTLResource", "MTLAllocation"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The web engine's check (examples/web_check.rs) runs outside the app, so it starts AppKit itself.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
# The zero-copy check (examples/zero_copy.rs) reads textures back from the GPU.
sp-render.workspace = true
pollster.workspace = true

# Calls into the system's media frameworks need `unsafe`; this crate alone allows it, and only
# in its macOS module. Every unsafe block says why it is sound.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
