[package]
name = "sp-winapi"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The few Windows calls the app can't make safely: finding a parent console to print to, asking
# a monitor for the part of it the taskbar leaves free, asking Windows the names the monitors give
# themselves, renaming a file into place written through to the disk, putting a folder on the
# user's PATH, reading what an installed program noted of itself for every user, reading and
# setting who may open the
# control socket's folder, keeping keys in the user's Credential Manager, holding the named mutex
# that keeps the app to one copy per data folder, letting the copy running come to the front
# when another start asks and asking the user's display languages for the message such a start
# shows when it gets no answer, and, for the app's file
# windows, setting up OLE on their thread, bringing one back in front and giving the operator's
# window the front again when one closes, hearing on the operator's window that Windows is
# ending the session (a log-off, a restart, a shut-down), so the app saves first, and telling
# Windows why the app keeps it waiting while it does, and asking Windows to keep the display on
# while the screens are on (a power request). windows-sys is already in the build (winit and
# others use it); this adds no crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Calling Windows needs `unsafe`; this crate allows it only in its `windows` module. Every
# unsafe block says why it is sound.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
