<!doctype html>
<html lang="en" data-look="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoftPresenter Remote Control</title>
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <button class="iconbtn navtoggle" id="navToggle" data-a="nav" aria-label="Playlist"></button>
  <div class="brand"><span class="mark"></span><span class="brandname" id="brand"></span></div>
  <div class="seg modes" id="modes"></div>
  <div class="top-mid">
    <div class="findwrap">
      <input class="find" id="find" data-i="find" placeholder="Find a song, a line, or a verse" autocomplete="off" spellcheck="false"><kbd class="find-k" title="Press / to search from anywhere">/</kbd>
      <div class="found" id="found" hidden></div>
    </div>
    <button class="conn" id="connBtn" data-a="menu:link"><i></i><span>Connecting…</span></button>
    <div class="note" id="note" role="status" aria-live="polite"></div>
  </div>
  <div class="top-right">
    <span class="runtimer mono" id="runTimer" hidden></span>
    <span class="clock mono" id="clock">--:--:--</span>
    <button class="out" id="outAudience" data-a="out:audience" title="Audience screens on or off (Option-A)"><i class="led"></i><span>Audience</span><b class="mono"></b><kbd class="kh">⌥A</kbd></button>
    <button class="out" id="outStage" data-a="out:stage" title="Stage screens on or off (Option-T)"><i class="led"></i><span>Stage</span><b class="mono"></b><kbd class="kh">⌥T</kbd></button>
    <button class="iconbtn keysbtn" data-a="keysSheet" title="Every key (press ?)" aria-label="Keys">?</button>
    <button class="iconbtn" id="gear" data-a="mode:settings" title="Settings" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.6"/><circle cx="6" cy="11.5" r="1.6"/></svg></button>
  </div>
</header>

<main class="main">
  <aside class="left" id="left"></aside>
  <section class="center">
    <div class="slides" id="slides"></div>
    <div class="foot" id="foot"></div>
    <div class="media" id="media"></div>
  </section>
  <aside class="right">
    <div class="program" id="program"><div id="pgHead"></div><div class="monitor"><div class="thumb" id="monThumb"><video id="monVideo" muted playsinline hidden></video><div id="monLayers"></div></div></div><div id="pgFoot"></div></div>
    <div class="layers" id="layers"></div>
    <div class="transport" id="transport"></div>
    <div class="tabs" id="tabs"></div>
    <div class="tabbody" id="tabbody"></div>
  </aside>
</main>

<div class="notice" id="notice" hidden></div>
<div class="mobilebar" id="mobilebar"></div>
<div class="scrim" id="scrim"></div>
<div class="ui-menu" id="menu" hidden></div>
<div class="ui-over" id="sheet" hidden></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
