<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SoftPresenter Remote Control</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login">
<main class="lg-card">
  <div class="lg-brand"><span class="mark"></span><b>SoftPresenter</b></div>
  <p class="lg-what">Remote Control</p>
  <form id="signin" class="lg-form" method="post">
    <label class="ui-f" for="password"><span class="cap">Password</span></label>
    <input class="field" id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="btn primary lg-go" type="submit" id="signinGo" disabled>Sign In</button>
    <p id="said" class="lg-said" role="status"></p>
  </form>
  <p class="lg-note">This device is remembered once it signs in, until it is forgotten in Settings › Phone remote on the computer.</p>
</main>
<script src="/login.js"></script>
</body>
</html>
