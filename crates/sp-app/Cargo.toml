[package]
name = "sp-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "softpresenter"
path = "src/main.rs"

[dependencies]
sp-ndi.workspace = true
sp-decklink.workspace = true
sp-bible.workspace = true
# Videos, and pictures in the system's own formats (HEIC, TIFF...).
sp-video.workspace = true
ureq.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
sp-model.workspace = true
sp-engine.workspace = true
sp-render.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
png.workspace = true
image.workspace = true
chrono.workspace = true
trash.workspace = true
rfd.workspace = true
rodio.workspace = true
zip.workspace = true
flate2.workspace = true
fs4.workspace = true
# Remote Control (src/remote): a small HTTPS and WebSocket server on its own thread, running
# only while switched on. HTTP/1.1 and WebSocket only, no middleware stacks; TLS through the
# rustls the app already has (ring, as ureq uses), a certificate made here, and argon2id for
# the password. docs/licences/remote-control.md lists every crate they bring.
axum = { version = "0.8", default-features = false, features = ["http1", "ws", "tokio"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
# The VoxLive API key, kept in the Keychain.
security-framework = "3"
# Where the pointer is while files are dragged onto the window from the Finder, which the
# window library doesn't say (file_drop.rs). Already linked, for sp-video.
objc2-core-graphics = "0.3"

[target.'cfg(windows)'.dependencies]
# The socket `sp` reaches the app through: the kind Unix has, which the standard library
# doesn't offer on Windows yet.
uds_windows = "1.2"

[dev-dependencies]
# `.pro` documents written for tests, to put in the song bundles the tests make.
sp-model = { workspace = true, features = ["test-documents"] }
# A WebSocket client for Remote Control's tests, the version axum serves with (no new crate).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[lints]
workspace = true
