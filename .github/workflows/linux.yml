name: Linux

on:
  push:
    branches: [master]
  pull_request:

# As in the other checks: a newer push to a pull request cancels the run still going for an
# older one; on master every run finishes.
concurrency:
  group: linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    name: Build, tests and lints on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOFTPRESENTER_QUIET: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What the build links against or reads its headers from: sound (ALSA) and fonts
      # (fontconfig), and the window system's libraries (Wayland, X11 and its keyboard). DejaVu
      # Sans is the interface face the app looks for on Linux, so the tests that measure words
      # measure them in it. FFmpeg lets the screen-receiving tests decode their pictures, as
      # they do on a computer that has it; without it they fail here (on a computer without
      # GitHub's setting they say so and pass). The end-to-end
      # tests start the app itself, which needs a display and a graphics device: a virtual X
      # display (Xvfb, started by xvfb-run, which needs xauth), the X keyboard library winit
      # loads as it starts, and Mesa's Vulkan and OpenGL drivers, which draw on the processor.
      - name: Install the system's libraries, a font, FFmpeg and a virtual display
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-dev
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev fonts-dejavu-core ffmpeg
          xvfb xauth libxkbcommon-x11-0 libx11-xcb1 mesa-vulkan-drivers libvulkan1 libegl1
          libgl1-mesa-dri
      - name: Install the Rust version in rust-toolchain.toml
        run: rustup toolchain install
      # Saved from master only; a pull request reads master's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest@0.9.152
      - name: Build
        run: cargo build --workspace
      # The tests run with cargo-nextest, each as a process of its own (.config/nextest.toml,
      # profile ci): first all but the end-to-end ones, so a test binary added later runs here.
      # On a virtual display as the end-to-end tests are, as before; these tests don't notice it.
      - name: Tests, all but the end-to-end ones
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          cargo nextest run --profile ci --workspace --exclude sp-render --no-fail-fast
          -E 'not binary_id(sp-app::e2e)'
      # nextest doesn't run documentation tests. There are none today; this runs any added later.
      - name: Documentation tests
        if: success() || failure()
        run: cargo test --workspace --exclude sp-render --doc --no-fail-fast
      # The end-to-end tests (crates/sp-app/tests/e2e.rs) start the app, on a virtual display.
      # Without a display they fail here, as a skip nobody chose is a failure on GitHub (on a
      # computer they skip, saying so). One copy at a time, as the harness's own lock keeps them
      # under cargo test: --no-capture runs the tests one after another (nextest's processes are
      # out of that lock's reach), and passes their output straight through, notices and
      # timings. The same packages as the step above, so nothing is built again.
      - name: End-to-end tests (on a virtual display)
        if: success() || failure()
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          cargo nextest run --profile ci --workspace --exclude sp-render --test e2e --no-fail-fast
          --no-capture
      - name: Tests (sp-render, without the picture tests)
        if: success() || failure()
        run: cargo nextest run --profile ci -p sp-render --lib --no-fail-fast
      - name: Lints
        if: success() || failure()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Say which tests were left out
        if: success() || failure()
        run: >-
          echo "::notice title=Picture tests skipped::crates/sp-render/tests/golden.rs compares
          against pictures made on the maintainer's Mac with its GPU and fonts, so it runs there,
          not here."
