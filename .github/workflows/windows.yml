name: Windows

on:
  push:
    branches: [master, windows-ci]
  pull_request:

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    # The name the earlier runs had, so anything that waits on this check by name still finds it.
    name: Build and tests on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOFTPRESENTER_QUIET: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Git on GitHub's Windows machines turns LF into CRLF as it checks files out;
      # .gitattributes keeps every text file LF, so the app built here carries the same page,
      # skills and tables as one built on a Mac. This says so plainly if that ever stops.
      - name: Text files are checked out with LF line endings
        shell: bash
        run: |
          crlf=$(git ls-files --eol | grep -E 'w/(crlf|mixed)' || true)
          if [ -n "$crlf" ]; then
            echo "$crlf"
            echo "::error title=CRLF in the checkout::These files were checked out with CRLF line endings; .gitattributes should keep them LF."
            exit 1
          fi
      - name: Install the Rust version in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --workspace
      # The end-to-end tests (crates/sp-app/tests/e2e.rs) are among them: they start the app
      # itself, as a quiet copy, drawing with WARP (DirectX 12 on the processor), as these
      # machines have no graphics card. On WARP the app works out its pictures on the processor
      # (sp_render::early_stages_on_processor): WARP faults on one of the renderer's stages.
      - name: Tests
        run: cargo test --workspace --exclude sp-render --no-fail-fast
      # A program Windows stopped (an access violation, say) leaves its name, the module it
      # stopped in and the place there in the Application log: printed when a step failed, as
      # the tests can only say the exit code.
      - name: Say what Windows logged about stopped programs
        if: failure()
        shell: pwsh
        run: |
          $stopped = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000 } -MaxEvents 20 -ErrorAction SilentlyContinue
          if (-not $stopped) { "Windows logged no stopped program."; exit 0 }
          $stopped | ForEach-Object { "--- " + $_.TimeCreated.ToString('u'); $_.Message }
      - name: Tests (sp-render, without the picture tests)
        if: success() || failure()
        run: cargo test -p sp-render --lib --no-fail-fast
      # After the tests, so that a lint only Windows' own compiler finds doesn't hide their
      # results.
      - name: Lints
        if: success() || failure()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Say which tests were left out
        if: success() || failure()
        run: >-
          echo "::notice title=Picture tests skipped::crates/sp-render/tests/golden.rs compares
          against pictures made on the maintainer's Mac with its GPU and fonts, so it runs there,
          not here."
